name: publish-image

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native arm64 runner — no QEMU. Falls back to ubuntu-latest + setup-qemu
    # if the repo is private without arm runner minutes.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/chrisvlds/gym-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell gym-tracker-infra to pin this build and re-publish the manifest
      # artifact that Flux reconciles onto the Pi.
      - name: Notify gym-tracker-infra
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          TAG="sha-${GITHUB_SHA:0:7}"
          jq -nc --arg tag "$TAG" \
            '{event_type:"image-updated",client_payload:{image:"gym-api",tag:$tag}}' \
          | gh api -X POST repos/chrisvlds/gym-tracker-infra/dispatches --input -
          echo "Dispatched image-updated for gym-api:$TAG"
