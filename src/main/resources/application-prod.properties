# CORS is unused in prod (nginx proxies /api same-origin) but harmless to keep.
gym-api.cors.allowed-origins=https://gym.chrisvds.com

# Datasource comes from SPRING_DATASOURCE_* env set by the k8s Deployment.
spring.jpa.hibernate.ddl-auto=update

# Don't die on startup if Postgres isn't up yet — retry; readiness stays down
# (actuator health includes the DB) until it connects. StatefulSet + startupProbe
# give it time.
spring.datasource.hikari.initialization-fail-timeout=-1
