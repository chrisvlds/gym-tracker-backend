spring.application.name=gym-api
server.port=8080

# Actuator: expose only what k8s probes + /actuator/info need
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.build.enabled=true

# Persistence. Default = a local H2 file DB for dev/tests; the `prod` profile
# and the SPRING_DATASOURCE_* env (set by the k8s Deployment) point at Postgres.
spring.datasource.url=jdbc:h2:file:./data/gymapi;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Let Tomcat deliver a clean 413 for oversized state blobs instead of dropping
# the connection while swallowing the unread body.
server.tomcat.max-swallow-size=8MB
